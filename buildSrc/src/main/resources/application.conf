// HOCON syntax: https://github.com/lightbend/config/blob/main/HOCON.md

project {
  name       : farseek-mods
  description: "A monorepo for the Farseek library and the Minecraft mods that use it."
  license    : "MIT"
  licensePage: "https://opensource.org/license/mit"
  homepage   : "https://github.com/delvr/Farseek-Mods"
  issuesPage : ${project.homepage}"/issues"
  workflows  : ${project.homepage}"/actions/workflows"
  badges     : ["githubWorkflow:push", "githubWorkflow:publish"]
}
mod-defaults {
  license    : ${project.license}
  homepage   : ${project.homepage}
  issuesPage : ${project.issuesPage}
  licensePage: ${project.licensePage}
  authors    : [delvr]
  mavenGroup : "io.github.delvr"
}
mods {
  farseek: ${mod-defaults} {
    description : "A Scala API for Minecraft mods."
    dependencies: [neoforge, scala]
    platformIds : ["curseforge:229708", "modrinth:SlKHbCyh"]
  }
  repose: ${mod-defaults} {
    description : "This mod allows players and mobs to smoothly walk up and down hills without jumping."
    dependencies: [farseek]
    platformIds : ["curseforge:220524", "modrinth:vgIu0FCG"]
  }
  streams: ${mod-defaults} {
    description : "This mod introduces real flowing rivers, with a true current, to your Minecraft worlds."
    dependencies: [farseek]
    platformIds : ["curseforge:229769", "modrinth:lkKoniya"]
  }
}
dependencies {
  farseek: ${mods.farseek} {
    hostPlatform: modrinth
    minVersion  : "3.0.0-beta.1"
    maxVersion  : "3.0.0-beta.1"
  }
  neoforge {
    displayName: "NeoForge"
    homepage   : "https://neoforged.net"
    mavenGroup : net.neoforged
    mavenName  : neoforge
    // https://neoforged.net/changelog
    minVersion : "26.2.0.57"
    maxVersion : "26.2.999"
  }
  scala {
    homepage   : "https://github.com/scala/scala3"
    mavenGroup : org.scala-lang
    mavenName  : scala-library
    type       : embedded
    // https://github.com/scala/scala3/releases
    minVersion : "3.9.0"
    maxVersion : "3.9.999"
  }
}
platforms {
  maven-central {
    mavenUri: "https://repo1.maven.org/maven2"
    homepage: "https://mvnrepository.com/artifact/PLACEHOLDER"
    badgeUri: ${badgeHosts.devins}"/available/maven-central_vector.svg"
  }
  curseforge {
    displayName: "CurseForge"
    homepage   : "https://www.curseforge.com/projects/PLACEHOLDER"
    badgeUri   : ${badgeHosts.devins}"/available/curseforge_vector.svg"
  }
  modrinth {
    homepage  : "https://modrinth.com/mod/PLACEHOLDER"
    badgeUri  : ${badgeHosts.devins}"/available/modrinth_vector.svg"
    # https://support.modrinth.com/en/articles/8801191-modrinth-maven
    mavenUri  : "https://api.modrinth.com/maven"
    mavenGroup: "maven.modrinth"
  }
}
authors {
  delvr {
    displayName: "delvr"
    homepage   : "https://linktr.ee/delvr"
    description: "Visit me on Linktree: "${authors.delvr.homepage}
    badges: ["githubUser:delvr", "youtubeUser:delvr", "kofiUser:delvr"]
  }
}
badges: ${dependencies} ${platforms} {
  // https://docs.github.com/en/actions/how-tos/monitor-workflows/add-a-status-badge
  githubWorkflow {
    homepage: ${project.workflows}"/PLACEHOLDER.yml"
    badgeUri: ${project.workflows}"/PLACEHOLDER.yml/badge.svg"
  }
  githubUser {
    homepage: "https://github.com/PLACEHOLDER"
    badgeUri: ${badgeHosts.devins}"/social/github-singular_vector.svg"
  }
  youtubeUser {
    homepage: "https://www.youtube.com/@PLACEHOLDER"
    badgeUri: ${badgeHosts.devins}"/social/youtube-singular_vector.svg"
  }
  kofiUser {
    homepage: "https://ko-fi.com/PLACEHOLDER"
    badgeUri: ${badgeHosts.devins}"/donate/kofi-singular_vector.svg"
  }
}
badgeHosts {
  // https://intergrav.github.io/devins-badges-docs/badges
  devins: "https://cdn.jsdelivr.net/npm/@intergrav/devins-badges@3/assets/cozy"
}
