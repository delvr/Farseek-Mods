ext {
    AllMods = subprojects
    Farseek = project("farseek")
    buildAnyMod = file("build-any-mod.gradle")
    buildAppMod = file("build-app-mod.gradle")
}

File readme = rootProject.file("README.md")
gradle.projectsEvaluated {
    readme.write("") // clear file contents
    (["# $title", description] + AllMods.collectMany { it.readmeSection }).forEach { readme << it << "\n" }
}
