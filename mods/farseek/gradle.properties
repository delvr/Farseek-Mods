neoForge.parchment.minecraftVersion = 1.21.5
neoForge.parchment.mappingsVersion  = 2025.06.01

# Releases: https://github.com/scala/scala3/releases
# Warning: avoid "latest.release" as it includes nightly builds
scalaLibrary = scala3-library_3
scalaVersion = 3.7.1
