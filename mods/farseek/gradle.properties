name = farseek
title = Farseek
description = A Scala API for Minecraft mods.
authors = delvr
status  = alpha
version = 3.0-alpha.1
curseForgeId = 229708
modrinthId   = TODO

# https://projects.neoforged.net/neoforged/neoforge
